version: "3.9"
services:
  mysql:
    image: mysql:8.0
    container_name: combination-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: combinationdb
      MYSQL_USER: combination
      MYSQL_PASSWORD: combinationpass
    ports:
      - "3306:3306"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - combination-data:/var/lib/mysql
volumes:
  combination-data:
